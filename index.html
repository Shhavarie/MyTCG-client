
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TCG Simulator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         ホーム画面
    ========================== -->
   <div id="home-screen" class="screen active">

    <h1>My TCG Simulator</h1>

    <!-- ロール選択 -->
    <div class="home-menu">
        <button id="user1-button">ユーザー1として開始</button>
        <button id="user2-button">ユーザー2として開始</button>
        <button id="spectator-button">観戦者として開始</button>
    </div>

    <!-- デッキ選択 -->
    <div class="home-guide">
        <h2>デッキ選択</h2>

        <!-- サンプルデッキ -->
        <label>サンプルデッキを選択：</label>
        <select id="sample-deck-select">
            <option value="">選択してください</option>
            <option value="SAMPLE001">サンプルデッキA</option>
            <option value="SAMPLE002">サンプルデッキB</option>
            <option value="SAMPLE003">サンプルデッキC</option>
        </select>

        <br><br>

        <!-- デッキコード入力 -->
        <label>デッキコードを入力：</label>
        <input id="deck-code-input" type="text" placeholder="例：ABC123-XYZ789" />

        <br><br>

        <button id="start-with-deck-button">このデッキで開始</button>
    </div>

    <!-- デッキ構築 -->
    <div class="home-guide">
        <h2>デッキ構築</h2>
        <p>デッキを作成する場合はこちらから。</p>
        <button id="deck-builder-button">デッキ構築画面へ</button>
    </div>

</div>

<div id="deck-builder-screen" class="screen">

    <h1>デッキ構築</h1>

    <!-- 操作エリア -->
    <div class="deck-builder-controls">

        <button id="back-to-home-button">
            ホームへ戻る
        </button>

        <button id="generate-deck-code-button">
            デッキコード生成
        </button>

        <input
            id="builder-deck-code"
            type="text"
            readonly
            placeholder="デッキコード"
        >

        <button id="load-deck-code-button">
            読み込み
        </button>

    </div>

    <!-- カード一覧・デッキ -->
    <div class="deck-builder-container">

        <!-- カード一覧 -->
        <section class="card-list">
            <h2>カード一覧</h2>
            <div
                id="builder-card-list"
                class="builder-card-list"
            ></div>
        </section>

        <!-- デッキ -->
        <section class="deck-area">
            <h2>
                デッキ（<span id="deck-count">0</span>/60）
            </h2>

            <div
                id="builder-deck-list"
                class="builder-deck-list"
            ></div>

        </section>

    </div>

</div>
<Fieldset</Fieldset>
    <!-- =========================
         ゲーム画面
    ========================== -->
    <div id="game-screen" class="screen">

        <!-- 上部バー -->
        <header class="top-bar">

            <div class="game-title">
                My TCG Simulator
            </div>

            <div class="top-actions">

                <button id="dice-button">
                    🎲 ダイス
                </button>

                <button id="undo-button">
                    ↩ 元に戻す
                </button>

                <button id="home-button">
                    🏠 ホーム
                </button>

            </div>

        </header>


        <!-- =========================
             メインゲームエリア
        ========================== -->
        <main class="game-area">

<!-- =========================================================
     初期配置カード選択
========================================================= -->
<div
    id="initial-card-overlay"
    class="initial-card-overlay"
    style="display: none;"
>
    <div class="initial-card-window">
        <!-- タイトル -->
        <div class="initial-card-header">
            <h2>
                初期配置カードを選択
            </h2>
            <p>
                デッキから最初に場に出すカードを1枚選んでください。
            </p>
        </div>
        <!-- カード一覧 -->
        <div
            id="initial-card-list"
            class="initial-card-list"
        >
            <!-- JavaScriptでカードを生成します -->
        </div>
        <!-- 選択中カード -->
        <div class="initial-card-selected">
            <span>
                選択中：
            </span>
            <span
                id="initial-card-selected-label"
            >
                カードを選択してください
            </span>
        </div>
        <!-- 決定ボタン -->
        <div class="initial-card-actions">
            <button
                id="initial-card-confirm-button"
                class="initial-card-confirm-button"
                disabled
            >
                このカードを初期配置する
            </button>
        </div>
    </div>
</div>

            <!-- =====================
                 左パネル
            ====================== -->
            <aside class="left-panel">


                <!-- デッキ -->
                <section class="deck-zone">

                    <h2>デッキ</h2>

                    <div
                        id="deck"
                        class="deck"
                        title="ダブルクリックでカードを引く"
                    >
                        <div class="deck-label">
                            DECK
                        </div>
                    </div>

                    <div class="deck-buttons">

                        <button id="draw-button">
                            カードを引く
                        </button>

                        <button id="draw-hidden-button">
                            裏向きで引く
                        </button>

                        <button id="shuffle-deck-button">
                            デッキをシャッフル
                        </button>

                    </div>

                </section>


                <!-- =====================
                     手札
                ====================== -->
                <section class="hand-zone">

                    <h2>手札</h2>

                    <div
                        id="hand"
                        class="hand"
                    ></div>

                </section>

            </aside>



            <!-- =========================
                 ボード
            ========================== -->
            <section class="board-area">

                <div class="board-wrapper">

                    <div
                        id="board"
                        class="board"
                    >

                        <img
                            src="./img/bords/playmat.png"
                            class="board-background"
                            alt="プレイマット"
                        >


                        <!-- =================
                             PP
                        ================== -->
                        <div
                            id="pp-zone"
                            class="pp-zone"
                        >

                            <div
                                class="pp-slot"
                                data-pp="0"
                            >
                                1
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="1"
                            >
                                2
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="2"
                            >
                                3
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="3"
                            >
                                4
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="4"
                            >
                                5
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="5"
                            >
                                6
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="6"
                            >
                                7
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="7"
                            >
                                8
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="8"
                            >
                                9
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="9"
                            >
                                10
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="10"
                            >
                                11
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="11"
                            >
                                12
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="12"
                            >
                                13
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="13"
                            >
                                14
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="14"
                            >
                                15
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="15"
                            >
                                16
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="16"
                            >
                                17
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="17"
                            >
                                18
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="18"
                            >
                                19
                            </div>

                            <div
                                class="pp-slot"
                                data-pp="19"
                            >
                                20
                            </div>

                        </div>


                        <!-- =================
                             ボード上カード
                        ================== -->
                        <div
                            id="board-cards"
                            class="board-cards"
                        ></div>

                    </div>

                </div>

            </section>



            <!-- =========================
                 右パネル
            ========================== -->
            <aside class="right-panel">


                <!-- =====================
                     選択カード詳細
                ====================== -->
                <section
                    id="selected-card-detail"
                    class="selected-card-detail"
                >

                    <h2>カード詳細</h2>

                    <div
                        id="selected-card-content"
                        class="selected-card-content"
                    >

                        <p class="no-selected-card">
                            カードを選択してください
                        </p>

                    </div>

                </section>


                <!-- =====================
                     操作ログ
                ====================== -->
                <section class="log-zone">

                    <h2>操作ログ</h2>

                    <div
                        id="action-log"
                        class="action-log"
                    ></div>

                </section>

            </aside>

        </main>

    </div>



    <!-- =========================
         右クリックメニュー
    ========================== -->
    <div
        id="context-menu"
        class="context-menu hidden"
    >

        <button data-action="face-up">
            表向きにする
        </button>

        <button data-action="face-down">
            裏向きにする
        </button>


               <button data-action="stack">
            下に重ねる
        </button>

    </div>



    <!-- =========================
         ダイス結果
    ========================== -->
    <div
        id="dice-result"
        class="dice-result hidden"
    >

        <div class="dice-result-number">
            2
        </div>

    </div>



    <!-- JavaScript -->
    <script src="./script.js"></script>

</body>
</html>
